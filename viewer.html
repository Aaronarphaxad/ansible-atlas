<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Offline by design: this policy blocks every network request (no fonts, scripts, images or fetches from anywhere). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ansible Atlas</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5f6b7a;--line:#d9dee5;--soft:#eef1f5;--accent:#2563eb;--accent-soft:#dbe7ff;
  --sel:#f59e0b;--warn:#b45309;--warn-soft:#fff4e0;--code:#f1f3f6;
  --c-playbook:#2563eb;--c-play:#7c3aed;--c-role:#0d9488;--c-task:#475569;--c-handler:#c2410c;--c-block:#64748b;
  --c-include:#0891b2;--c-section:#94a3b8;--c-var:#9333ea;--c-template:#be185d;--c-file:#64748b;--c-script:#ca8a04;--c-error:#dc2626;--c-warning:#d97706;--c-info:#2563eb;--c-inventory:#16a34a;--c-group:#15803d;--c-host:#65a30d;--c-root:#334155;--c-missing:#dc2626;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;font-size:14px;color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0f1318;--panel:#171c23;--ink:#e6e9ee;--muted:#93a0b0;--line:#2a323d;--soft:#1f262f;--accent:#60a5fa;--accent-soft:#1e3354;
  --sel:#fbbf24;--warn:#fbbf24;--warn-soft:#3a2d12;--code:#11161c;
  --c-playbook:#60a5fa;--c-play:#a78bfa;--c-role:#2dd4bf;--c-task:#94a3b8;--c-handler:#fb923c;--c-block:#8b9bb0;
  --c-include:#22d3ee;--c-section:#64748b;--c-var:#c084fc;--c-template:#f472b6;--c-file:#94a3b8;--c-script:#facc15;--c-error:#f87171;--c-warning:#fbbf24;--c-info:#60a5fa;--c-inventory:#4ade80;--c-group:#34d399;--c-host:#a3e635;--c-root:#cbd5e1;--c-missing:#f87171;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);height:52px}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
nav.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px}
nav.tabs button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.themebtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:15px;line-height:1}
.themebtn:hover{border-color:var(--accent)}
.search{position:relative;margin-left:auto;width:min(440px,38vw)}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.search .ico{position:absolute;left:10px;top:7px;color:var(--muted);pointer-events:none}
.results{position:absolute;top:38px;left:0;right:0;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:50;display:none}
.results.open{display:block}
.res{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--soft)}
.res.on,.res:hover{background:var(--accent-soft)}
.res .t{flex:1;min-width:0}
.res .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .c{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-hint{padding:8px 10px;font-size:12px;color:var(--muted)}
main{display:flex;height:calc(100% - 52px)}
#view{flex:1;position:relative;overflow:hidden;min-width:0}
#detail{width:440px;max-width:48vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:0 0 40px}
#resizer{width:5px;cursor:col-resize;background:transparent;margin-left:-3px;z-index:5}
#resizer:hover{background:var(--accent-soft)}
svg#graph{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#graph.drag{cursor:grabbing}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.edge.hl{stroke:var(--sel);stroke-width:2.2}
.node rect.box{fill:var(--panel);stroke:var(--line);stroke-width:1.2;rx:8}
.node:hover rect.box{stroke:var(--accent)}
.node.sel rect.box{stroke:var(--sel);stroke-width:3}
.node.twin rect.box{stroke:var(--sel);stroke-dasharray:4 3;stroke-width:2}
.node.match rect.box{fill:var(--accent-soft)}
.node .stripe{rx:2}
.node text{fill:var(--ink);font-size:13px;pointer-events:none}
.node text.sub{fill:var(--muted);font-size:11px}
.node .tog circle{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.node .tog:hover circle{stroke:var(--accent);fill:var(--accent-soft)}
.node .tog text{font-size:11px;fill:var(--muted);text-anchor:middle;font-weight:600}
.node .ext{font-size:10px}
svg.far .node text.sub{display:none}
svg.vfar .node text{display:none}
.node{cursor:pointer}
.toolbar{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:4}
.toolbar button,.toolbar select,.btn{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:7px;cursor:pointer}
.toolbar button:hover,.btn:hover{border-color:var(--accent)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--panel) 88%,transparent);padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted);z-index:4;max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.zoomlbl{position:absolute;right:12px;top:16px;font-size:12px;color:var(--muted);z-index:4}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap;flex:none}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin:1px 2px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
/* detail */
.dh{position:sticky;top:0;background:var(--panel);padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.dh h2{margin:6px 0 2px;font-size:17px;line-height:1.3;word-break:break-word}
.dh .crumbs{font-size:12px;color:var(--muted)}
.dh .nav{display:flex;gap:6px;align-items:center}
.dsec{padding:10px 16px;border-bottom:1px solid var(--soft)}
.dsec h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:8px}
.desc{font-size:14px;line-height:1.45;margin:2px 0 0}
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:4px 6px;border-top:1px solid var(--soft);vertical-align:top;word-break:break-word}
table.kv td:first-child{color:var(--muted);width:34%;white-space:nowrap;word-break:normal}
table.vars td:first-child{white-space:normal;word-break:break-all;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
code{background:var(--code);padding:1px 4px;border-radius:4px;word-break:break-word}
pre{background:var(--code);padding:6px 8px;border-radius:6px;margin:2px 0;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.src{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.lnk{color:var(--accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.lnk:hover{text-decoration:underline}
.lnklist{display:flex;flex-direction:column;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer;background:var(--panel)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.ovr{font-size:11px;color:var(--muted);margin-top:2px}
.ovr s{opacity:.8}
.vfilter{width:100%;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:6px;font-size:12px}
.hlrow{background:var(--accent-soft)}
.empty{color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:8px;font-size:12px;margin-top:6px}
.path{font-size:12px;color:var(--muted);margin:2px 0}
/* pages (plan / overview) */
.page{position:absolute;inset:0;overflow:auto;padding:18px 22px 60px}
.page h1{font-size:20px;margin:0 0 4px}
.page h2{font-size:15px;margin:22px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:default}
.card b{font-size:22px;display:block}
.card span{font-size:12px;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.planbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}
.planbar label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.planbar select,.planbar input{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.play{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.playhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--c-play) 7%,var(--panel))}
.playhead .ttl{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px;cursor:pointer}
.step{display:grid;grid-template-columns:44px 92px 1fr;gap:8px;padding:6px 14px;border-top:1px solid var(--soft);cursor:pointer;align-items:start}
.step:hover{background:var(--soft)}
.step.on{background:var(--accent-soft)}
.step .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:12px;padding-top:2px}
.step .ph{font-size:11px;color:var(--muted);padding-top:2px}
.step .main{min-width:0}
.step .nm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step .ds{font-size:12px;color:var(--muted);margin-top:1px}
.step .via{font-size:11px;color:var(--c-role)}
.step.dim{opacity:.7}
.cond{font-size:11px;color:var(--warn)}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
ul.plain{margin:4px 0;padding-left:18px}
details.dsec>summary{list-style:none;cursor:pointer}
details.dsec>summary::-webkit-details-marker{display:none}
details.dsec>summary h3{margin:0}
details.dsec>summary h3::before{content:"▸";display:inline-block;width:10px;transition:transform .15s}
details.dsec[open]>summary h3::before{transform:rotate(90deg)}
details.dsec[open]>summary{margin-bottom:6px}
.menu{position:relative}
.menu>summary{list-style:none;border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:7px;cursor:pointer}
.menu>summary::-webkit-details-marker{display:none}
.menu>div{position:absolute;top:34px;left:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:180px;z-index:20}
.menu>div button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;cursor:pointer}
.menu>div button:hover{background:var(--soft)}
.menu>div hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.legend-btn{position:absolute;left:12px;bottom:12px;z-index:4}
.legend{bottom:48px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--code);border-radius:8px;overflow:auto;max-height:65vh;padding:6px 0;line-height:1.5}
.code .ln{display:flex;white-space:pre}
.code .ln>i{font-style:normal;color:var(--muted);opacity:.6;width:38px;text-align:right;padding-right:10px;flex:none;user-select:none}
.code .ln.hit{background:var(--accent-soft)}
.code .jj{color:var(--c-template)}
.code .vr{color:var(--c-var);cursor:pointer;text-decoration:underline dotted}
#detail.wide{width:70vw;max-width:70vw}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:-4px 0 14px;display:grid;gap:10px}
.filters .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters input[type=text]{width:220px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.off{text-decoration:line-through;color:var(--muted)}
.cmd{display:flex;gap:8px;align-items:center}
.cmd code{flex:1;padding:6px 8px;display:block;white-space:pre-wrap;word-break:break-all}
.sumline{font-size:13px;margin:0 0 10px;color:var(--muted)}
.sumline b{color:var(--ink)}
.step.skip{opacity:.38}
.sev{font-size:10px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:4px;color:#fff;flex:none}
.sev.error{background:var(--c-error)}.sev.warning{background:var(--c-warning)}.sev.info{background:var(--c-info)}
.finding{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--soft);font-size:13px}
.finding:first-child{border-top:0}
.finding .fm{flex:1;min-width:0}
a.srclink{cursor:pointer;color:var(--muted);text-decoration:none}
a.srclink:hover{color:var(--accent);text-decoration:underline}
.filesbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}
.filesbar input{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);width:280px}
.ftree details{margin-left:4px}
.ftree summary{cursor:pointer;padding:3px 6px;border-radius:6px;font-size:13px;color:var(--muted);list-style:none}
.ftree summary::-webkit-details-marker{display:none}
.ftree summary::before{content:"▸ ";}
.ftree details[open]>summary::before{content:"▾ ";}
.ftree summary:hover{background:var(--soft)}
.frow{display:flex;gap:8px;align-items:center;padding:4px 8px 4px 22px;border-radius:6px;cursor:pointer;font-size:13px}
.frow:hover,.frow.on{background:var(--accent-soft)}
.frow .fk{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fs{font-size:11px;color:var(--muted)}
.scriptcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.scriptcard:hover{border-color:var(--accent)}
.live{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;color:var(--muted);background:var(--panel);white-space:nowrap}
.live.on{color:#16a34a;border-color:#16a34a}
/* keyboard focus is always visible */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.node:focus-visible{outline:none}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:14px;line-height:1;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent)}
body.nodetail #detail,body.nodetail #resizer{display:none}
.showdetail{position:absolute;right:12px;top:52px;z-index:6;display:none}
body.nodetail .showdetail{display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;min-width:340px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.overlay h2{margin:0 0 10px;font-size:16px}
.overlay table{border-collapse:collapse;font-size:13px}
.overlay td{padding:4px 12px 4px 0;vertical-align:top}
.overlay td:first-child{white-space:nowrap}
.tagp{font-size:10px;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:2px}
ul.plain li{margin:2px 0}
</style>
</head>
<body>
<header>
  <div class="brand">Ansible Atlas <small id="repoName"></small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="Search variables, hosts, groups, tasks, roles…  ( / )" autocomplete="off" spellcheck="false">
    <div class="results" id="results"></div>
  </div>
  <button class="iconbtn" id="helpBtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
  <button class="themebtn" id="themeBtn" title="Toggle light / dark mode (T)"></button>
</header>
<main>
  <section id="view"></section>
  <button class="btn showdetail" id="showDetail" title="Show the details panel (])">⇤ Details</button>
  <div id="resizer"></div>
  <aside id="detail"></aside>
</main>
<script>
"use strict";
const D=/*__ATLAS_DATA__*/null;
const ENT=D?D.entities:{};
const $=s=>document.querySelector(s);
const SVGNS="http://www.w3.org/2000/svg";

/* ------------------------------------------------------------ helpers */
function el(tag,props,...kids){
  const n=document.createElement(tag);
  if(props) for(const[k,v]of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==="class") n.className=v; else if(k==="style") n.style.cssText=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else if(k==="text") n.textContent=v; else n.setAttribute(k,v);
  }
  for(const k of kids.flat(9)){ if(k==null||k===false) continue; n.append(k.nodeType?k:document.createTextNode(String(k))); }
  return n;
}
function sv(tag,attrs,...kids){const n=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs||{}))if(v!=null)n.setAttribute(k,v);for(const k of kids)if(k!=null)n.append(k.nodeType?k:document.createTextNode(String(k)));return n;}
const TYPES={
  root:{c:"--c-root",i:"◎",n:"Root"}, playbook:{c:"--c-playbook",i:"PB",n:"Playbook"}, play:{c:"--c-play",i:"▶",n:"Play"},
  role:{c:"--c-role",i:"R",n:"Role"}, task:{c:"--c-task",i:"T",n:"Task"}, handler:{c:"--c-handler",i:"H",n:"Handler"},
  block:{c:"--c-block",i:"{}",n:"Block"}, include_tasks:{c:"--c-include",i:"⤷",n:"include_tasks"}, import_tasks:{c:"--c-include",i:"⤷",n:"import_tasks"},
  include_role:{c:"--c-role",i:"⤷R",n:"include_role"}, import_role:{c:"--c-role",i:"⤷R",n:"import_role"},
  section:{c:"--c-section",i:"§",n:"Section"}, inventory:{c:"--c-inventory",i:"INV",n:"Inventory"}, group:{c:"--c-group",i:"G",n:"Group"},
  host:{c:"--c-host",i:"⌂",n:"Host"}, missing:{c:"--c-missing",i:"!",n:"Missing"}, var:{c:"--c-var",i:"$",n:"Variable"}, template:{c:"--c-template",i:"J2",n:"Template"}, file:{c:"--c-file",i:"F",n:"File"}, script:{c:"--c-script",i:"$_",n:"Script"}
};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const tcol=t=>`var(${(TYPES[t]||TYPES.task).c})`;
function badge(t){const T=TYPES[t]||{i:"?",n:t};return el("span",{class:"badge",style:`background:${tcol(t)}`,title:T.n},T.n);}
function short(s,n=80){s=String(s??"");return s.length>n?s.slice(0,n-1)+"…":s;}
function fmt(v){if(v==null)return"null";if(typeof v==="string")return v;return JSON.stringify(v);}
function valNode(v){
  if(v!==null&&typeof v==="object"){const s=JSON.stringify(v,null,2);return el("pre",null,s);}
  const s=fmt(v);

function codeView(text,opt={}){

function resolveLimit(inv,pattern){

  const hostsOf=Object.values(ENT).filter(e=>e.type==="host"&&e.inventory===inv);
  const all=new Set(hostsOf.map(h=>h.id));
  const groupHosts=g=>new Set(ENT[`group:${inv}:${g}`]?.all_hosts||[]);
  const glob=t=>new RegExp("^"+t.replace(/[.+^${}()|\\]/g,"\\$&").replace(/\*/g,".*").replace(/\?/g,".")+"$");
  const match=t=>{
    if(t==="all"||t==="*")return new Set(all);
    if(ENT[`group:${inv}:${t}`])return groupHosts(t);
    let rx=null;try{rx=t.startsWith("~")?new RegExp(t.slice(1)):(/[*?[]/.test(t)?glob(t):null);}catch(_){return new Set();}
    if(rx){const out=new Set(hostsOf.filter(h=>rx.test(h.label)).map(h=>h.id));
      for(const g of Object.values(ENT))if(g.type==="group"&&g.inventory===inv&&rx.test(g.label))for(const h of g.all_hosts)out.add(h);return out;}
    return ENT[`host:${inv}:${t}`]?new Set([`host:${inv}:${t}`]):new Set();
  };
  let res=new Set();
  for(const t of toks)if(!/^[&!]/.test(t))for(const h of match(t))res.add(h);
  for(const t of toks)if(t.startsWith("&")){const m=match(t.slice(1));res=new Set([...res].filter(h=>m.has(h)));}
  for(const t of toks)if(t.startsWith("!")){const m=match(t.slice(1));for(const h of m)res.delete(h);}

const INDEX=[];
const USES_BY_OWNER=new Map();
function buildIndex(){
  const add=(eid,kind,label,ctx,text,extra)=>INDEX.push({eid,kind,label,ctx,text:text.toLowerCase(),ll:String(label).toLowerCase(),...extra});
  for(const e of Object.values(ENT)){
    if(e.type==="root"||e.type==="section")continue;
    if(e.type==="var"){
      for(const u of e.uses){if(!USES_BY_OWNER.has(u.o))USES_BY_OWNER.set(u.o,[]);const l=USES_BY_OWNER.get(u.o);if(!l.includes(e.label))l.push(e.label);}
      add(e.id,"var",e.label,ctxOf(e),[e.label,...e.defs.map(d=>fmt(d.v)+" "+d.src)].join(" ").slice(0,4000));continue;
    }
    if(e.type==="template"){add(e.id,"template",e.path,e.role?"template · role "+e.role:"template",e.path+" "+((D.files[e.path]||{}).text||"").slice(0,60000));continue;}
    if(e.type==="script"){add(e.id,"script",e.path,e.summary.join("; "),e.path+" "+((D.files[e.path]||{}).text||"").slice(0,30000));continue;}
    if(e.type==="file")continue;
    const kind=["include_tasks","import_tasks","include_role","import_role","block"].includes(e.type)?"task":e.type;
    add(e.id,kind,e.label,ctxOf(e),[e.label,e.module,e.desc,e.src,e.path,e.sub,fmt(e.hosts),fmt(e.when),fmt(e.tags),e.args?JSON.stringify(e.args).slice(0,600):""].filter(Boolean).join(" "));
  }
  for(const l of USES_BY_OWNER.values())l.sort();
  for(const p of Object.keys(D.files||{})){const f=D.files[p];INDEX.push({eid:"file:"+p,kind:"file",label:p,ctx:(f.kind||"file")+(f.lines?` · ${f.lines} lines`:""),text:p.toLowerCase(),ll:p.toLowerCase()});}
}
const KIND_ORDER={var:0,host:1,group:2,role:3,play:4,playbook:5,task:6,handler:7,template:8,script:8,inventory:9,file:10,missing:11};
let hits=[],hi=0;
function doSearch(q){
  const box=$("#results");q=q.trim();
  if(!q){box.classList.remove("open");searchHits=new Set();if(VIEWS[current])drawGraph();return;}
  let kind=null;const m=q.match(/^(host|group|var|task|role|play|playbook|handler|file|inventory|inv|template|tpl|script):\s*(.*)$/i);
  if(m){kind=m[1].toLowerCase();if(kind==="inv")kind="inventory";if(kind==="tpl")kind="template";q=m[2];}
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored=[];
  for(const it of INDEX){
    if(kind&&it.kind!==kind)continue;
    if(!terms.every(t=>it.text.includes(t)))continue;
    const t0=terms[0]||"";let s=KIND_ORDER[it.kind]??9;
    const key=it.ll;
    if(key===q.toLowerCase())s-=30;else if(key.startsWith(t0))s-=20;else if(it.ll.includes(t0))s-=10;
    scored.push([s,it]);
    if(scored.length>4000)break;
  }
  scored.sort((a,b)=>a[0]-b[0]||a[1].label.length-b[1].label.length);
  // collapse duplicate var hits per (key,value) into first few
  hits=scored.slice(0,150).map(x=>x[1]);hi=0;
  searchHits=new Set(hits.filter(h=>h.eid&&h.kind!=="var").map(h=>h.eid));
  box.replaceChildren();
  if(!hits.length)box.append(el("div",{class:"res-hint"},"No matches. Try fewer letters, or a prefix like var: or host:"));
  hits.forEach((h,i)=>box.append(el("div",{class:"res"+(i===0?" on":""),onmousedown:ev=>{ev.preventDefault();pick(i);}},
    badge(h.kind==="file"?"section":ENT[h.eid]?.type||h.kind),
    el("div",{class:"t"},el("div",{class:"l"},h.label),el("div",{class:"c"},h.ctx)))));
  box.append(el("div",{class:"res-hint"},`${scored.length>150?"Top 150 of "+scored.length:scored.length} result(s) · ↑↓ to move · Enter to open · matching nodes are tinted in the map`));
  box.classList.add("open");
  if(VIEWS[current])drawGraph();
}
function pick(i){

    if(t){hl=[];((D.files[ENT[h.eid].path]||{}).text||"").split("\n").forEach((l,i)=>{if(l.toLowerCase().includes(t))hl.push(i+1);});}}
  select(h.eid,{search:true,hl:hl&&hl.length?hl:null});

  label();$("header").insertBefore(b,$("#themeBtn"));
  for(const ev of ["pointerdown","keydown","wheel"])document.addEventListener(ev,()=>{lastInput=Date.now();},{passive:true});
  const every=Math.max(3,(w.interval||2)*2)*1000;
  setInterval(()=>{
    if(!on||document.hidden)return;
    if(Date.now()-lastInput<4000)return;                          // don't interrupt while you're interacting
    if(document.activeElement&&["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;
    if(document.querySelector("details.menu[open]"))return;
    saveState();location.reload();
  },every);
}

/* ------------------------------------------------------------ small UX helpers */
function setDetailHidden(h){
  document.body.classList.toggle("nodetail",h);
  try{localStorage.setItem("atlas-detail-hidden",h?"1":"0");}catch(_){}
  if(VIEWS[current])requestAnimationFrame(()=>applyTransform());
}
function showShortcuts(){
  if(document.querySelector(".overlay"))return;
  const rows=[["/","Search"],["1 – 6","Switch tab (Playbooks, Roles, Inventory, Run plan, Files, Overview)"],
    ["F","Fit the map to the screen"],["Double-click","Fit (on empty map space) · expand/collapse (on a node)"],
    ["Drag · scroll","Pan · zoom the map"],["]","Show / hide the details panel"],["Backspace · Alt+←","Back to the previous item"],
    ["T","Light / dark mode"],["Esc","Close search, menus and this help"],["?","This help"]];
  const ov=el("div",{class:"overlay",onclick:e=>{if(e.target===ov)ov.remove();}},
    el("div",{class:"sheet",role:"dialog","aria-label":"Keyboard shortcuts"},el("h2",null,"Keyboard shortcuts"),
      el("table",null,rows.map(([k,d])=>el("tr",null,el("td",null,...k.split(" · ").map((x,i)=>[i?" · ":"",el("span",{class:"kbd"},x)])),el("td",null,d)))),
      el("p",{class:"note",style:"margin:12px 0 0"},"Read-only explorer: nothing is executed and nothing leaves this page.")));
  document.body.append(ov);
}

/* ------------------------------------------------------------ boot */
function boot(){
  if(!D){document.body.replaceChildren(el("p",{style:"padding:20px"},"No data embedded. Generate this page with atlas.py."));return;}
  $("#repoName").textContent=D.meta.repo;document.title="Ansible Atlas — "+D.meta.repo;
  buildView("playbooks",D.trees.playbooks,4);
  buildView("roles",D.trees.roles,1);
  buildView("inventory",D.trees.inventory,4);
  $("#themeBtn").addEventListener("click",toggleTheme);
  $("#helpBtn").addEventListener("click",showShortcuts);
  $("#showDetail").addEventListener("click",()=>setDetailHidden(false));
  try{if(localStorage.getItem("atlas-detail-hidden")==="1")document.body.classList.add("nodetail");
    const w=localStorage.getItem("atlas-detail-width");if(w)$("#detail").style.width=w;}catch(_){}
  const tabs=$("#tabs");TABS.forEach(([k,n],i)=>tabs.append(el("button",{"data-t":k,title:`${n} (${i+1})`,onclick:()=>setTab(k)},n)));
  for(const[p,f]of Object.entries(D.files||{}))ENT["file:"+p]={id:"file:"+p,type:"file",label:p.split("/").pop(),path:p,kind:f.kind};
  for(const e of Object.values(ENT)){if(e.src&&e.type!=="section"){if(!ENTS_BY_SRC.has(e.src))ENTS_BY_SRC.set(e.src,[]);ENTS_BY_SRC.get(e.src).push(e.id);}
    if((e.type==="template"||e.type==="script")&&e.path)SPECIAL_BY_PATH.set(e.path,e.id);}
  indexFindings();
  buildIndex();
  const q=$("#q");
  q.addEventListener("input",()=>doSearch(q.value));
  q.addEventListener("focus",()=>{if(q.value.trim())doSearch(q.value);});
  q.addEventListener("blur",()=>setTimeout(()=>$("#results").classList.remove("open"),120));
  q.addEventListener("keydown",e=>{
    const rs=[...document.querySelectorAll(".res")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hi=Math.max(0,Math.min(rs.length-1,hi+(e.key==="ArrowDown"?1:-1)));rs.forEach((r,i)=>r.classList.toggle("on",i===hi));rs[hi]?.scrollIntoView({block:"nearest"});}
    else if(e.key==="Enter"){e.preventDefault();pick(hi);}
    else if(e.key==="Escape"){q.value="";doSearch("");q.blur();}
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){document.querySelector(".overlay")?.remove();document.querySelectorAll("details.menu[open]").forEach(m=>m.open=false);}
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;
    if(e.metaKey||e.ctrlKey)return;
    if(e.altKey&&e.key==="ArrowLeft"&&history.length){e.preventDefault();back();return;}
    if(/^[1-6]$/.test(e.key)&&!e.altKey){setTab(TABS[+e.key-1][0]);return;}
    if(e.key==="?"){e.preventDefault();showShortcuts();return;}
    if(e.key==="]"){setDetailHidden(!document.body.classList.contains("nodetail"));return;}
    if(e.key==="/"){e.preventDefault();q.focus();q.select();}
    else if((e.key==="f"||e.key==="F")&&VIEWS[current])fit();
    else if(e.key==="t"||e.key==="T")toggleTheme();
    else if(e.key==="Backspace"&&history.length){e.preventDefault();back();}
  });
  // resizable detail panel
  const rz=$("#resizer"),det=$("#detail");
  rz.addEventListener("pointerdown",e=>{rz.setPointerCapture(e.pointerId);const sx=e.clientX,sw=det.offsetWidth;
    const mv=ev=>{det.style.width=Math.max(280,Math.min(window.innerWidth*0.7,sw-(ev.clientX-sx)))+"px";};
    const up=()=>{rz.removeEventListener("pointermove",mv);rz.removeEventListener("pointerup",up);try{localStorage.setItem("atlas-detail-width",det.style.width);}catch(_){}};
    rz.addEventListener("pointermove",mv);rz.addEventListener("pointerup",up);});
  window.addEventListener("resize",()=>{if(VIEWS[current])applyTransform();});
  window.addEventListener("pagehide",saveState);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)saveState();});
  setupLive();
  const st=loadState();
  if(st&&restoreState(st)){booted=true;return;}
  if(!st)setTab("playbooks");
  const firstPb=VIEWS.playbooks.root.kids[0];
  renderDetail(firstPb?ENT[firstPb.e]:ENT["root:playbooks"]);if(firstPb){selected=firstPb.e;selectedNode=firstPb;markSelected();}
  booted=true;
}
boot();
</script>
</body>
