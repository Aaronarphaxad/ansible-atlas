name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag: a tag can be moved to malicious code, a commit can't.
      # Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # don't leave the GitHub token in .git/config for later steps

      # Use the runner's own Python 3 (no setup-python download that can go
      # missing when GitHub moves to a new Ubuntu image) and the distro's PyYAML.
      - name: PyYAML
        run: python3 -c "import yaml" 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml)

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: No generated maps or private keys committed
        run: |
          MARK="ansible-atlas-""generated-output"
          bad=$(git grep -lF "$MARK" -- . || true)
          keys=$(git grep -lE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' -- . || true)
          if [ -n "$bad$keys" ]; then
            echo "::error::Generated output or private keys committed:"; echo "$bad"; echo "$keys"; exit 1
          fi
