- name: Configure web tier
  hosts: web:!app-stg-web02
  become: true
  vars:
    app_release: "1.4.2"
  roles:
    - role: nginx
      tags: [nginx]
    - app
  tasks:
    - name: Ensure app is reachable
      ansible.builtin.uri:
        url: "http://localhost:{{ http_port }}/health"
        status_code: 200
      retries: 5
      delay: 3
